<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Monitoring wall: alerts flow from HQ to five regions to townships. Most are auto-routed; a repeating one escalates to a person.">
  <style>
    text { font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .p2 { animation-delay: .7s } .p3 { animation-delay: 1.3s } .p4 { animation-delay: 1.9s } .p5 { animation-delay: 2.3s }
    @keyframes ping { 0% { transform: scale(.3); opacity: .9 } 80%, 100% { transform: scale(2.6); opacity: 0 } }
    .esc { offset-path: path("M 520 380 C 560 330, 620 300, 690 300"); animation: esc 3.2s ease-in-out infinite; }
    @keyframes esc { 0%, 30% { offset-distance: 0%; opacity: 0 } 40% { opacity: 1 } 85% { offset-distance: 100%; opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
    .blink { animation: blink 3.2s steps(1) infinite; }
    @keyframes blink { 0%, 80% { opacity: .25 } 85%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .ping, .esc, .blink { animation: none } .blink { opacity: 1 } }
  </style>
  <rect width="800" height="600" fill="#0E1620"/>
  <!-- the wall: six screens -->
  <g fill="#132131" stroke="#2C3E50" stroke-width="3">
    <rect x="30" y="30" width="230" height="150" rx="6"/><rect x="285" y="30" width="230" height="150" rx="6"/><rect x="540" y="30" width="230" height="150" rx="6"/>
    <rect x="30" y="205" width="485" height="300" rx="6"/><rect x="540" y="205" width="230" height="300" rx="6"/>
  </g>
  <!-- small screens: server rooms, power, fiber -->
  <g font-size="13" fill="#9AA6B0" letter-spacing="1">
    <text x="46" y="56">SERVER ROOMS 机房</text><text x="301" y="56">POWER · BACKUP</text><text x="556" y="56">CABLE · FIBER</text>
  </g>
  <g fill="#3F8FCF"><rect x="46" y="70" width="18" height="90" rx="2"/><rect x="70" y="95" width="18" height="65" rx="2"/><rect x="94" y="80" width="18" height="80" rx="2"/><rect x="118" y="110" width="18" height="50" rx="2"/><rect x="142" y="88" width="18" height="72" rx="2"/></g>
  <path d="M301 140 L330 120 L355 132 L380 100 L410 112 L440 90 L470 104 L500 96" fill="none" stroke="#4FD1BC" stroke-width="3"/>
  <path d="M556 120 H 640 M 660 120 H 754" stroke="#F2C879" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="634" y="150" font-size="12" fill="#F2C879">break · 东城</text>
  <!-- main screen: HQ → 5 regions → townships -->
  <text x="46" y="232" font-size="13" fill="#9AA6B0" letter-spacing="1">DONGGUAN · FAULT ROUTING</text>
  <g stroke="#3A5068" stroke-width="2" fill="none">
    <path d="M272 270 L90 335 M272 270 L180 335 M272 270 L272 335 M272 270 L364 335 M272 270 L455 335"/>
    <path d="M90 345 L68 410 M90 345 L112 410 M180 345 L160 410 M180 345 L200 410 M272 345 L252 410 M272 345 L292 410 M364 345 L344 410 M364 345 L384 410 M455 345 L435 410 M455 345 L475 410"/>
  </g>
  <rect x="242" y="255" width="60" height="26" rx="13" fill="#F2C879"/><text x="272" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2935">HQ</text>
  <g fill="#1D2935" stroke="#7FB0D6" stroke-width="2.5"><circle cx="90" cy="340" r="9"/><circle cx="180" cy="340" r="9"/><circle cx="272" cy="340" r="9"/><circle cx="364" cy="340" r="9"/><circle cx="455" cy="340" r="9"/></g>
  <g fill="#7FB0D6"><circle cx="68" cy="414" r="5"/><circle cx="112" cy="414" r="5"/><circle cx="160" cy="414" r="5"/><circle cx="200" cy="414" r="5"/><circle cx="252" cy="414" r="5"/><circle cx="292" cy="414" r="5"/><circle cx="344" cy="414" r="5"/><circle cx="384" cy="414" r="5"/><circle cx="435" cy="414" r="5"/><circle cx="475" cy="414" r="5"/></g>
  <!-- routine alerts: pinged and auto-assigned -->
  <g fill="none" stroke="#7FB0D6" stroke-width="2">
    <circle class="ping" cx="112" cy="414" r="9"/><circle class="ping p2" cx="252" cy="414" r="9"/><circle class="ping p3" cx="435" cy="414" r="9"/><circle class="ping p4" cx="160" cy="414" r="9"/><circle class="ping p5" cx="344" cy="414" r="9"/>
  </g>
  <!-- the odd one: same request, same region, same time -->
  <g fill="#F2C879"><circle cx="384" cy="414" r="6"/><circle cx="394" cy="424" r="4"/><circle cx="376" cy="426" r="4"/></g>
  <text x="300" y="460" font-size="12" fill="#F2C879">same issue × 3, same place, same time</text>
  <text x="46" y="490" font-size="13" fill="#9AA6B0">routine → auto-assigned to the township</text>
  <path d="M520 380 C 560 330, 620 300, 690 300" fill="none" stroke="#F2C879" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/>
  <circle class="esc" r="7" fill="#F2C879"/>
  <!-- the human -->
  <text x="556" y="232" font-size="13" fill="#9AA6B0" letter-spacing="1">ESCALATED</text>
  <circle cx="690" cy="300" r="34" fill="#1D2935" stroke="#F2C879" stroke-width="3" class="blink"/>
  <circle cx="690" cy="290" r="10" fill="#F2C879"/><path d="M670 318 C 672 302, 708 302, 710 318" fill="#F2C879"/>
  <text x="655" y="365" font-size="13" fill="#E8EDF1">a person looks</text>
  <rect x="560" y="400" width="190" height="80" rx="10" fill="#1D2935" stroke="#2C3E50"/>
  <text x="576" y="430" font-size="13" fill="#E8EDF1">confident → automate</text>
  <text x="576" y="456" font-size="13" fill="#F2C879">ambiguous → a human</text>
  <text x="400" y="560" text-anchor="middle" font-size="15" fill="#B7C2CB">Same shape as my active-learning research: let the system handle what it's sure of.</text>
</svg>
